version: "3.8"

services:
  # PostgreSQL Database
  postgres_db:
    image: postgres:17-alpine
    container_name: greenprep_database
    restart: always
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MinIO Object Storage
  minio.local:
    image: minio/minio
    restart: always
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    env_file:
      - .env
    volumes:
      - ./certs:/root/.minio/certs:ro
      - ./data:/data
    command: server /data --console-address ":9001"

  # MinIO Init (runs once to create user & bucket)
  minio-init:
    build:
      context: .
      dockerfile: Dockerfile.minio-init
    container_name: minio-init
    env_file:
      - .env
    depends_on:
      - minio.local

  # GP-API (Backend Node.js)
  server:
    build: ./GP-API
    container_name: greenprep_api
    ports:
      - 3010:3010
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres_db
    volumes:
      - file_uploads:/app/uploads

  # GP-Admin (Web Teacher)
  web_teacher:
    build:
      context: ./GP-Admin
      args:
        - VITE_BASE_URL=$VITE_BASE_URL
    container_name: web_teacher
    ports:
      - 3000:3000
    restart: always
    environment:
      - VITE_BASE_URL
    depends_on:
      - server
    volumes:
      - ./certs:/etc/nginx/certs:ro

  # GP-Student (Web Student)
  web_student:
    build:
      context: ./GP-Student
      args:
        - VITE_BASE_URL=$VITE_BASE_URL
    container_name: web_student
    ports:
      - 3001:3001
    restart: always
    environment:
      - VITE_BASE_URL
    depends_on:
      - server
    volumes:
      - ./certs:/etc/nginx/certs:ro

volumes:
  postgres_data: {}
  file_uploads: {}
